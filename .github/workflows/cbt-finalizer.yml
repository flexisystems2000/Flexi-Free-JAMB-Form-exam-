
name: Flexi CBT Server Finalizer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexi-cbt-finalizer
  cancel-in-progress: false

jobs:
  finalize-expired-attempts:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Run CBT Finalizer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is missing"
            exit 1
          fi

          response=$(curl --silent --show-error --fail \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Cache-Control: no-cache" \
            "https://flexi-free-jamb-form-exam.vercel.app/api/cbt/finalize-expired")

          echo "$response"

          echo "$response" | jq -e '.ok == true' > /dev/null
