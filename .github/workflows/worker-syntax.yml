name: Cloudflare Worker syntax checks

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "worker/**"
      - "package.json"
      - ".github/workflows/worker-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker modules
        run: npm run check
